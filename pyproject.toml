[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudrig-cli"
version = "0.2.2"
description = "Find a cloud GPU. Rent it. Get to work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=14,<15", "textual>=6,<7", "filelock>=4.2.1,<5"]

[project.scripts]
crig = "cloudrig.cli:main"

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudrig"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
