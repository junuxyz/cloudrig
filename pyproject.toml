[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudrig"
version = "0.2.8"
description = "Rent a cloud GPU and open a remote project."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["rich>=14,<15", "textual>=6,<7", "filelock>=4.2.1,<5"]

[project.scripts]
crig = "cloudrig.cli:main"

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudrig"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
