[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudrig"
version = "0.4.0"
description = "Rent Vast.ai GPUs, open VS Code, stop, and delete."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43,<47",
    "filelock>=4.2.1,<5",
    "rich>=14,<15",
    "textual>=6,<7",
]

[project.scripts]
crig = "cloudrig.cli:main"

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudrig"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
